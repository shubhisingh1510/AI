# Central config for the classical-vs-hybrid-quantum comparison.
# No magic numbers should be hardcoded in src/*.py — everything tunable lives here.

seed: 42

data:
  raw_dir: "data/raw"
  splits_dir: "data/splits"
  patient_id_csv: "data/patient_ids.csv"   # optional; used if present
  image_size: 224
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  kfold: 5
  extensions: [".jpg", ".jpeg", ".png"]

classical:
  backbone: "resnet50"
  pretrained: true
  freeze_backbone_epochs: 5      # epochs with early layers frozen before optional unfreeze
  unfreeze_after: true           # only used when gradual_unfreezing is false
  batch_size: 32
  epochs: 40
  lr_head: 0.001
  lr_finetune: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 4
  head_dropout: 0.3               # dropout before the final classification layer
  label_smoothing: 0.1
  # Gradual unfreezing (resnet50 only): instead of unfreezing the whole backbone at
  # freeze_backbone_epochs in one step, unfreeze one named block every unfreeze_every_n_epochs,
  # most task-specific first (see RESNET_UNFREEZE_ORDER in classical_baseline.py), each at
  # lr_finetune * lr_finetune_decay_per_block**i (i=0 for the first/most-recent block). Targets
  # the train~95%/val~75-77% overfitting gap documented in figures/classical_training_curves.png.
  gradual_unfreezing: true
  unfreeze_blocks: ["layer4", "layer3", "layer2", "layer1", "conv1_bn1"]
  unfreeze_every_n_epochs: 3
  lr_finetune_decay_per_block: 0.3
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.02

quantum:
  feature_encoding: "pca"  # "domain" (6 clinically-motivated features, src/domain_features.py,
                               # no CNN backbone needed) or "pca" (generic PCA-of-CNN-features,
                               # the original "quantum transfer learning" pattern). See README.
                               # Switched default from "domain" to "pca": results/ablation_results.csv
                               # (qubit x depth sweep, 2026-09-08) shows domain encoding tops out at
                               # ~0.37 test accuracy (barely above the 0.25 random baseline for 4
                               # classes) while pca reaches 0.72 test / 0.82 CV-mean at 6 qubits,
                               # depth 3 -- the best point in the grid. Domain stays available as an
                               # explicit alternative for anyone who wants the CNN-free variant.
  num_qubits: 6          # domain encoding always produces exactly 6; pca can use any count
  circuit_depth: 3        # number of StronglyEntanglingLayers; best point in ablation.py's sweep
  pca_dims: 6              # only used when feature_encoding: pca; must equal num_qubits
  batch_size: 32
  epochs: 60
  lr: 0.01
  weight_decay: 0.0
  early_stopping_patience: 10
  diff_method: "adjoint"   # PennyLane-Lightning analytic gradients

ablation:
  qubit_counts: [4, 6, 8]
  circuit_depths: [1, 2, 3]

paths:
  results_dir: "results"
  figures_dir: "figures"
