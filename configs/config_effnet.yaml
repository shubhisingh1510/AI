# Literature-informed variant of config.yaml: reproduces the Eff-ReLU-Net recipe
# (Chowdhury et al., PMC12220098) -- the only published result found on this exact AZH
# 4-class dataset that reaches ~90% accuracy. Same data/splits as config.yaml (so the
# comparison in evaluate_compare.py stays apples-to-apples on the identical test set),
# different classical architecture/training recipe. Writes to results_effnet/ and
# figures_effnet/ so it never overwrites the original resnet50 comparison.

seed: 42

data:
  raw_dir: "data/raw"
  splits_dir: "data/splits"
  patient_id_csv: "data/patient_ids.csv"
  image_size: 224
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  kfold: 5
  extensions: [".jpg", ".jpeg", ".png"]

classical:
  backbone: "efficientnet_b0_relu"
  augmentation: "heavy"
  optimizer: "adam"
  pretrained: true
  # A literal single-lr=0.01-SGD-from-scratch reproduction of the paper's recipe was tried
  # first and was unstable (val_loss spiked to 5.8 in places) and underperformed the resnet50
  # baseline (67% vs 74%) because early stopping cut training short before it settled. Reverted
  # to the same two-phase Adam schedule that got resnet50 to 74%, changing only the
  # backbone/head/augmentation, so the comparison isolates what those actually contribute.
  freeze_backbone_epochs: 5
  unfreeze_after: true
  batch_size: 32
  epochs: 40
  lr_head: 0.001
  lr_finetune: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 4
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.02

quantum:
  feature_encoding: "pca"   # PCA-of-CNN-features on the improved backbone, not the hand-designed
                             # domain features (which showed a large, real accuracy gap earlier).
  num_qubits: 8
  circuit_depth: 3
  pca_dims: 8
  batch_size: 32
  epochs: 60
  lr: 0.01
  weight_decay: 0.0
  early_stopping_patience: 10
  diff_method: "adjoint"

ablation:
  qubit_counts: [4, 6, 8]
  circuit_depths: [1, 2, 3]

paths:
  results_dir: "results_effnet"
  figures_dir: "figures_effnet"
