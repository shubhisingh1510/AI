# Central config for the classical-vs-hybrid-quantum comparison.
# No magic numbers should be hardcoded in src/*.py — everything tunable lives here.

seed: 42

data:
  raw_dir: "data/raw"
  splits_dir: "data/splits"
  patient_id_csv: "data/patient_ids.csv"   # optional; used if present
  image_size: 224
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  kfold: 5
  extensions: [".jpg", ".jpeg", ".png"]

classical:
  backbone: "resnet50"
  pretrained: true
  freeze_backbone_epochs: 5      # epochs with early layers frozen before optional unfreeze
  unfreeze_after: true
  batch_size: 32
  epochs: 40
  lr_head: 0.001
  lr_finetune: 0.00001
  weight_decay: 0.0001
  early_stopping_patience: 7
  num_workers: 4
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.02

quantum:
  num_qubits: 6          # = PCA output dimensions; ablation.py sweeps this
  circuit_depth: 2        # number of StronglyEntanglingLayers; ablation.py sweeps this
  pca_dims: 6              # must equal num_qubits
  batch_size: 32
  epochs: 60
  lr: 0.01
  weight_decay: 0.0
  early_stopping_patience: 10
  diff_method: "adjoint"   # PennyLane-Lightning analytic gradients

ablation:
  qubit_counts: [4, 6, 8]
  circuit_depths: [1, 2, 3]

paths:
  results_dir: "results"
  figures_dir: "figures"
